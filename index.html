<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaltWërk | TrailGuard</title>

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            background: #243541;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           CUSTOM SALTWËRK FONT
           ONLY USED FOR TRAILGUARD
        ========================= */

        @font-face {
            font-family: "Saltwerk";
            src: url("Saltwerk%20Font") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;

            background-image:
                linear-gradient(
                    180deg,
                    rgba(19, 55, 72, 0.18),
                    rgba(0, 30, 40, 0.30)
                ),
                url("mountain-trail.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* =========================
           HEADER
        ========================= */

        .top-banner {
            width: 100%;
            height: 90px;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            padding: 0 45px;

            background:
                linear-gradient(
                    135deg,
                    rgba(40, 55, 68, 0.96),
                    rgba(27, 39, 49, 0.94)
                );

            border-bottom: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 4px 25px rgba(0, 0, 0, 0.18);

            position: relative;
            z-index: 10;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .logo {
            width: 125px;
            height: auto;

            justify-self: start;

            opacity: 0;

            animation:
                logoFade 1s ease forwards;
        }

        @keyframes logoFade {

            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 42px;
        }

        .nav a {
            font-family: Arial, Helvetica, sans-serif;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 2.5px;

            color: rgba(255, 255, 255, 0.82);

            position: relative;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        .nav a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -8px;

            width: 0;
            height: 1px;

            background: white;

            transition:
                width 0.25s ease;
        }

        .nav a:hover {
            color: #ffffff;
        }

        .nav a:hover::after {
            width: 100%;
        }

        /* =========================
           SURVEY BUTTON
        ========================= */

        .survey-container {
            justify-self: end;
        }

        .survey-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 18px;

            border: 1px solid rgba(255, 255, 255, 0.75);

            font-family: Arial, Helvetica, sans-serif;

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 2px;

            color: white;

            background: rgba(255, 255, 255, 0.03);

            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }

        .survey-button:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 90px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 50px 25px 100px;

            position: relative;
            z-index: 5;
        }

        .hero::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255, 255, 255, 0.18),
                    transparent 35%
                );

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 1300px;

            text-shadow:
                0 4px 25px rgba(0, 30, 40, 0.42);
        }

        /* =========================
           TRAILGUARD
        ========================= */

        h1 {
            font-family: "Saltwerk", Arial, Helvetica, sans-serif;

            font-size: clamp(55px, 8vw, 105px);

            font-weight: normal;

            letter-spacing: 3px;

            line-height: 0.95;

            margin-bottom: 24px;

            text-align: center;

            width: 100%;

            opacity: 0;

            animation:
                fadeUp 1s ease 0.25s forwards;
        }

        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            max-width: 650px;

            margin: 0 auto 25px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: clamp(14px, 1.5vw, 18px);

            font-weight: 300;

            line-height: 1.6;

            letter-spacing: 0.4px;

            color: rgba(255, 255, 255, 0.88);

            text-shadow:
                0 3px 15px rgba(0, 30, 40, 0.45);

            opacity: 0;

            animation:
                fadeUp 1s ease 0.38s forwards;
        }

        /* =========================
           COMING SOON
        ========================= */

        .coming-soon {
            font-family: Arial, Helvetica, sans-serif;

            font-size: clamp(19px, 2.5vw, 28px);

            font-weight: 300;

            letter-spacing: 8px;

            margin-bottom: 45px;

            color: rgba(255, 255, 255, 0.92);

            opacity: 0;

            animation:
                fadeUp 1s ease 0.50s forwards;
        }

        /* =========================
           SOCIAL BUTTONS
        ========================= */

        .socials {
            display: flex;

            justify-content: center;

            gap: 22px;

            opacity: 0;

            animation:
                fadeUp 1s ease 0.65s forwards;
        }

        .social {
            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.75);

            box-shadow:
                0 8px 25px rgba(0, 30, 40, 0.25);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        .social:hover {
            transform:
                translateY(-7px)
                scale(1.08);

            background:
                rgba(255, 255, 255, 0.30);

            box-shadow:
                0 15px 35px rgba(0, 30, 40, 0.35);
        }

        .social svg {
            width: 27px;
            height: 27px;

            fill: white;
        }

        /* =========================
           LIGHT EFFECT
        ========================= */

        .light {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(132, 232, 245, 0.16),
                    transparent 70%
                );

            top: 25%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            animation:
                lightPulse 8s ease-in-out infinite alternate;
        }

        @keyframes lightPulse {

            from {
                opacity: 0.5;

                transform:
                    translate(-50%, -50%)
                    scale(0.9);
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }

        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;

            bottom: 18px;

            width: 100%;

            text-align: center;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            color:
                rgba(255, 255, 255, 0.78);

            z-index: 8;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .top-banner {
                height: auto;
                min-height: 90px;

                grid-template-columns: 1fr 1fr;

                padding:
                    15px 20px;
            }

            .logo {
                width: 105px;
            }

            .nav {
                grid-column: 1 / -1;
                grid-row: 2;

                gap: 24px;

                padding-top: 12px;
            }

            .nav a {
                font-size: 9px;
                letter-spacing: 1.8px;
            }

            .survey-container {
                justify-self: end;
            }

            .survey-button {
                padding: 9px 12px;

                font-size: 8px;
                letter-spacing: 1.4px;
            }

            .hero {
                min-height:
                    calc(100vh - 135px);

                padding:
                    45px 20px 90px;
            }

            h1 {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .description {
                font-size: 14px;
                max-width: 500px;
            }

            .coming-soon {
                font-size: 17px;
                letter-spacing: 5px;
                margin-bottom: 38px;
            }

            .social {
                width: 54px;
                height: 54px;
            }

            .social svg {
                width: 25px;
                height: 25px;
            }

        }

    </style>
</head>

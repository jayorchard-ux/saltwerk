<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaltWërk | TrailGuard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            background: #243541;
        }

        .page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;

            background-image:
                linear-gradient(
                    180deg,
                    rgba(19, 55, 72, 0.18),
                    rgba(0, 30, 40, 0.30)
                ),
                url("mountain-trail.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* =========================
           HEADER
        ========================= */

        .top-banner {
            width: 100%;
            height: 90px;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            padding: 0 40px;

            background:
                linear-gradient(
                    135deg,
                    rgba(40, 55, 68, 0.97),
                    rgba(27, 39, 49, 0.95)
                );

            border-bottom: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 4px 25px rgba(0, 0, 0, 0.18);

            position: relative;
            z-index: 10;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* =========================
           LOGO
        ========================= */

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .logo {
            width: 120px;
            height: auto;

            opacity: 0;

            animation:
                logoFade 1s ease forwards;
        }

        @keyframes logoFade {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           NAVIGATION
        ========================= */

        .nav-tabs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;
        }

        .nav-tab {
            position: relative;

            color: rgba(255, 255, 255, 0.90);

            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;

            text-decoration: none;

            padding: 8px 0;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        .nav-tab::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: 0;

            width: 0;
            height: 1px;

            background: #ffffff;

            transition: width 0.25s ease;
        }

        .nav-tab:hover {
            color: #ffffff;
        }

        .nav-tab:hover::after {
            width: 100%;
        }

        .nav-tab.disabled {
            cursor: pointer;
        }

        /* =========================
           SURVEY BUTTON
        ========================= */

        .survey-wrapper {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .survey-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 11px 17px;

            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 3px;

            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.7px;
            text-transform: uppercase;

            text-decoration: none;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;
        }

        .survey-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            transform: translateY(-1px);
        }

        .survey-arrow {
            font-size: 13px;
            line-height: 1;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 90px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 25px 100px;

            position: relative;
            z-index: 5;
        }

        .hero::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255, 255, 255, 0.18),
                    transparent 35%
                );

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            max-width: 900px;

            text-shadow:
                0 4px 25px rgba(0, 30, 40, 0.42);
        }

        h1 {
            font-size: clamp(58px, 10vw, 125px);
            font-weight: 800;
            letter-spacing: 8px;
            line-height: 0.95;
            margin-bottom: 22px;

            opacity: 0;

            animation:
                fadeUp 1s ease 0.25s forwards;
        }

        /* =========================
           PRODUCT DESCRIPTION
        ========================= */

        .description {
            max-width: 700px;
            margin: 0 auto 28px;

            font-size: clamp(14px, 1.7vw, 19px);
            font-weight: 300;
            line-height: 1.55;
            letter-spacing: 0.4px;

            color: rgba(255, 255, 255, 0.92);

            opacity: 0;

            animation:
                fadeUp 1s ease 0.40s forwards;
        }

        /* =========================
           COMING SOON
        ========================= */

        .coming-soon {
            font-size: clamp(17px, 2.2vw, 24px);
            font-weight: 300;
            letter-spacing: 9px;

            margin-bottom: 50px;

            opacity: 0;

            animation:
                fadeUp 1s ease 0.55s forwards;
        }

        /* =========================
           SOCIAL BUTTONS
        ========================= */

        .socials {
            display: flex;
            justify-content: center;
            gap: 18px;

            opacity: 0;

            animation:
                fadeUp 1s ease 0.70s forwards;
        }

        .social {
            width: 56px;
            height: 56px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.75);

            box-shadow:
                0 8px 25px rgba(0, 30, 40, 0.25);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        .social:hover {
            transform:
                translateY(-5px)
                scale(1.06);

            background:
                rgba(255, 255, 255, 0.30);

            box-shadow:
                0 15px 35px rgba(0, 30, 40, 0.35);
        }

        .social svg {
            width: 26px;
            height: 26px;

            fill: white;
        }

        /* =========================
           LIGHT EFFECT
        ========================= */

        .light {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(132, 232, 245, 0.16),
                    transparent 70%
                );

            top: 25%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            animation:
                lightPulse 8s ease-in-out infinite alternate;
        }

        @keyframes lightPulse {
            from {
                opacity: 0.5;

                transform:
                    translate(-50%, -50%)
                    scale(0.9);
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;

            bottom: 18px;

            width: 100%;

            text-align: center;

            font-size: 10px;

            letter-spacing: 3px;

            color:
                rgba(255, 255, 255, 0.78);

            z-index: 8;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeUp {
            from {
                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .top-banner {
                height: auto;
                min-height: 100px;

                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;

                padding: 15px 20px;
                gap: 8px 15px;
            }

            .logo-wrapper {
                grid-column: 1;
                grid-row: 1;
            }

            .logo {
                width: 105px;
            }

            .survey-wrapper {
                grid-column: 2;
                grid-row: 1;
            }

            .survey-button {
                padding: 9px 12px;
                font-size: 8px;
                letter-spacing: 1.3px;
            }

            .nav-tabs {
                grid-column: 1 / -1;
                grid-row: 2;

                gap: 22px;
                padding-bottom: 4px;
            }

            .nav-tab {
                font-size: 9px;
                letter-spacing: 1.4px;
            }

            .hero {
                min-height:
                    calc(100vh - 100px);

                padding:
                    50px 20px 90px;
            }

            h1 {
                font-size: 48px;
                letter-spacing: 4px;
                margin-bottom: 20px;
            }

            .description {
                max-width: 500px;
                font-size: 14px;
                line-height: 1.5;
                margin-bottom: 25px;
            }

            .coming-soon {
                font-size: 16px;
                letter-spacing: 6px;
                margin-bottom: 40px;
            }

            .social {
                width: 54px;
                height: 54px;
            }

            .social svg {
                width: 25px;
                height: 25px;
            }
        }

        @media (max-width: 430px) {

            .top-banner {
                padding-left: 15px;
                padding-right: 15px;
            }

            .nav-tabs {
                gap: 16px;
            }

            .nav-tab {
                font-size: 8px;
                letter-spacing: 1px;
            }

            .survey-button {
                padding: 8px 10px;
            }

            h1 {
                font-size: 42px;
            }

            .description {
                font-size: 13px;
            }

            .coming-soon {
                font-size: 14px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
